<script type="module">
/* ═══ SLUGGER PARK · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Arcade backyard baseball: Rockets (red) against Bluebirds (blue), 3 innings, 3 outs a side.
 * Versus, 2–8 players on two teams of four; bots fill every empty spot.
 * Pitch (fast, curve or change, aimed in or out of the zone), swing (move the ring onto the ball
 * and time it), then the camera follows the ball while the fielders chase, catch and throw.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ innings, the count, pitch speeds, swing timing windows, the park, running, fielding, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the host's clock
 *   FIELD ......... field coordinates, bases, fielder spots, the strike zone, pitch and ball flights
 *   PARK .......... renderer, grass and dirt, fence, crowd, scoreboard, players, ball, particles, sound
 *   GAME (HOST) ... seats, batters and pitchers, the count, calls, outs, innings, the winner
 *   PLAY (HOST) ... a ball in play: flight, bounces, fielders chasing and throwing, runners, outs, runs
 *   BOTS .......... how bots pitch and swing
 *   ME ............ my role this pitch: batting (ring + swing), pitching (type + aim), fielding, running
 *   VIEWS ......... the ball, fielders and runners on screens that aren't the host, eased between writes
 *   DRAW .......... placing everyone, the ball, effects, and the camera
 *   HUD & RESULTS . scoreboard, count, banners, calls, results card, leaderboard
 *   INPUT ......... mouse, keyboard, and touch buttons
 *   MAIN LOOP ..... one frame: host work, my role, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `hb` (heartbeat) once a second, `n`/`c` (name, color) once,
 *     and `rdy` (Play again). Nothing else: you never move your own body, the host places everyone.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. Only the host writes the shared fields:
 *       `game`  {id, v, phase, inn, half, outs, balls, strikes, score, ln, bases, seats, order, bat, pit,
 *               pa, pn, at, nx, call, st, rh, win}: the whole game (ln = runs per inning, st = each player's
 *               runs/hits/homers, rh = runs this half-inning). `v` goes up on every write.
 *       `pitch` {n, v, ty, ax, ay, w, at, ms, b, p, r, sw}: the pitch: its type, where it crosses the plate,
 *               and `at`, the moment it leaves the pitcher's hand (host clock). r/sw = the result + swing time.
 *       `ball`  {s, w, n, st, f, x, y, h, …, fl, rn, …}: the ball in play (a flight, rolling, held or
 *               thrown), all nine fielders `fl` and the runners `rn`, ~15 times a second.
 *     Every write carries the host's clock (`w`), so each screen knows the host's time (hostNow()).
 *   - THE BATTER DECIDES ITS OWN SWING. Its screen flies the pitch from `pitch.at`, measures the swing from
 *     the key or touch event itself, and judges timing + placement: whiff, foul, grounder, liner, fly or
 *     homer. It sends "swing" {n, res, dir, pw, la, t} (or "take" {n} if it let the ball go by). The host
 *     checks it is the right batter and pitch, clamps it, and builds the same flight from it, so the
 *     batter's own screen can fly the ball the instant it hits. The host decides for bots.
 *   - Other intents to the host: "pitch" {ty, ax, ay} (the pitcher's pick and aim), "throw" {n, base}
 *     (the fielding player taps a base), "run" {n} (the batter sends the runners an extra base).
 *   - The host runs everything else: fielders, catches, throws, runners, outs, runs and innings.
 *     A new host adopts `game`, `pitch` and `ball` and carries on. A host whose tab froze stops hosting,
 *     waits 0.7s for fresh state, then adopts it, so it never writes its old copy back.
 *   - Someone who joins takes a bot's spot on the team with fewer people; someone who leaves is replaced.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "slugger-hr": each player's most home runs in one game.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  innings: 3,            // innings in a game (a tie plays up to extraInnings more, then it's a draw)
  extraInnings: 2,
  lineup: 4,             // batters per team; people take turns, bots fill the rest
  outs: 3, strikes: 3, balls: 4,
  walks: true,           // four balls walks the batter; false = balls never run out (the batter must hit)
  mercyRuns: 6,          // a half-inning ends after this many runs
  introMs: 2600,         // "PLAY BALL" before the first pitch
  switchMs: 2600,        // the banner between half-innings
  botPitchMs: 1100,      // a bot pitcher waits this long before it throws
  pitchClockMs: 9000,    // a person pitching has this long to pick and throw (then it throws for you)
  windupMs: 950,         // from the pitch being called to the ball leaving the hand
  pitchMs: { fast: 540, curve: 780, change: 860 }, // how long each pitch takes to reach the plate
  aimError: 0.12,        // how far off (in zone half-widths) a pitch can miss its aim
  swingGraceMs: 1000,    // how long the host waits after the ball reaches the plate for the batter's verdict
  callMs: 1300,          // a ball/strike/foul call stays up this long
  playCallMs: 1700,      // after a ball in play
  hrCallMs: 2400,        // after a home run
  resultsMs: 16000,      // the results card before the next game (Play again skips it)
  // The swing: timing (ms off the moment the ball reaches the plate) and placement (zone half-widths).
  perfectMs: 45,         // this close to on time counts as perfect timing
  foulMs: 125,           // later or earlier than this: a foul tip at best
  missMs: 200,           // ...and this far off you miss it
  reach: 0.58,           // the ring's reach: ring centre to ball centre, further = a whiff
  hrPower: 0.72,         // power (timing + placement, 0..1) a fly or liner needs to leave the park
  // The park, in metres. Home plate is (0, 0); x runs toward first base, y out to centre field.
  baseD: 20,             // between the bases (short: it's a backyard park)
  mound: 13.5,           // home plate to the mound
  fenceR: 62, fenceH: 3, // the outfield wall's distance and height
  gravity: 14,           // a floaty arcade ball
  rollFriction: 0.55,    // how fast a rolling ball slows
  // Running and fielding
  runSpeed: 7.8,         // m/s round the bases
  leadOff: 0.45,         // with the ball in the air, runners who must go come this far off their base (0..1 of the way) and wait
  runSafeMs: 250,        // a runner only sets off for another base when it would beat the throw there by this much
  trotSpeed: 16,         // m/s on a home-run trot (fast-forwarded)
  fieldSpeed: 6.2,       // m/s fielders run
  reactMs: 350,          // fielders wait this long after contact before they move
  catchR: 1.4,           // a fielder this close to a ball in the air below catchH catches it
  catchH: 2.3,
  pickR: 0.9,            // ...and picks up a rolling ball this close
  throwSpeed: 24,        // m/s
  throwDelayMs: 420,     // a fielder takes this long to set and throw
  playMaxMs: 16000,      // a play still going after this long is called where it stands
  // Bots
  botSwingZone: 0.8,     // chance a bot swings at a strike...
  botChase: 0.28,        // ...and at a ball
  botHits: { whiff: 0.18, foul: 0.2, ground: 0.2, liner: 0.25, fly: 0.12, hr: 0.06 }, // what a bot's swing does (before pitch effects)
  botStrike: 0.64,       // share of a bot's pitches aimed in the zone
  botRunMs: 500,         // a bot batter thinks about RUN! this long after its ball comes down...
  botRunSafeMs: 150,     // ...and sends everyone only when they'd all beat the throw by this much
  sendMs: 66,            // the host writes the ball, fielders and runners ~15 times a second
  board: "slugger-hr",
};
const TEAMS = [{ name: "Rockets", short: "RKT", color: "#e8453c", dark: "#7a1712" }, { name: "Bluebirds", short: "BLU", color: "#2f7bf5", dark: "#0f3a85" }];
const COLORS = ["#ffd23f", "#ffffff", "#7cf29a", "#c99bff", "#ff8fd0", "#3ee6d8", "#b6ff4a", "#ffa94d"]; // each person's own color: bat, cap button, ring
const BOT_NAMES = ["Moonshot", "Lefty", "Big Sal", "Zippy", "Dinger", "Pops", "Knuckles", "Scooter", "Tank", "Buzz"]; // bot "b1" is Moonshot
const SKINS = ["#f1c9a5", "#c68a5a", "#8d5a3b", "#e8b48a", "#5e3a24"];
const PITCHES = { fast: { name: "FASTBALL", rise: 0.08, side: 0 }, curve: { name: "CURVEBALL", rise: 0.42, side: 0.55 }, change: { name: "CHANGEUP", rise: 0.22, side: -0.15 } };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'slugger-park',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
/** Am I the host? Never in the first 0.7s after this tab wakes from a freeze (fresh state arrives first). */
const isHost = () => performance.now() >= host.quietUntil && livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch
/** The host's clock. Every ball write carries it (`w`); we keep the smallest gap seen lately (the least delayed write). */
const clock = { off: 0, samples: [], lastS: -1 };
function noteHostClock(b) {
  if (!b || b.s === clock.lastS || typeof b.w !== "number") return;
  clock.lastS = b.s;
  const now = performance.now();
  clock.samples.push({ at: now, d: b.w - Date.now() });
  while (clock.samples.length && now - clock.samples[0].at > 4000) clock.samples.shift();
  clock.off = Math.max(...clock.samples.map((s) => s.d));
}
const hostNow = () => Date.now() + (net.offline || isHost() ? 0 : clock.off);
/** The host-clock time of an input event, measured from the event itself (not from when we got round to it). */
const eventHostTime = (e) => hostNow() - Math.max(0, performance.now() - (e && e.timeStamp > 0 ? e.timeStamp : performance.now()));

// ── FIELD ───────────────────────────────────────────────────────────────────────────
// Field coordinates in metres: home plate at (0, 0), x toward first base, y out to centre field, h up.
// three.js world: (x, h, -y), so the camera behind home looks down -z with first base on the right.
const G = CONFIG.gravity, BD = CONFIG.baseD, BX = BD / Math.SQRT2;
const BASES = [{ x: 0, y: 0 }, { x: BX, y: BX }, { x: 0, y: 2 * BX }, { x: -BX, y: BX }]; // home, 1st, 2nd, 3rd (base 4 = home again)
const baseAt = (k) => BASES[k % 4];
const FIELDERS = [ // where the nine fielders stand between plays
  { n: "P", x: 0, y: CONFIG.mound }, { n: "C", x: 0, y: -1.6 }, { n: "1B", x: BX + 2.5, y: BX + 4 }, { n: "2B", x: 6.5, y: 2 * BX + 1.5 },
  { n: "SS", x: -6.5, y: 2 * BX + 1.5 }, { n: "3B", x: -BX - 2.5, y: BX + 4 }, { n: "LF", x: -26, y: 46 }, { n: "CF", x: 0, y: 54 }, { n: "RF", x: 26, y: 46 },
];
const OUTFIELD = 6; // fielders 6, 7, 8 are the outfielders
const ZONE = { y: 0.4, h0: 0.95, hw: 0.32, hh: 0.38 }; // the strike zone: distance out from home, middle height, half width, half height
const REL = { x: 0.35, y: CONFIG.mound - 0.7, h: 1.85 }; // where the pitcher lets go
const BOX = { x: -0.95, y: 0.35 };                         // where the batter stands (a righty)
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const isBot = (id) => /^b\d+$/.test(id || "");
const inZone = (ax, ay) => Math.abs(ax) <= 1.05 && Math.abs(ay) <= 1.05;

  $("row0").classList.toggle("bat", g.half === 0); $("row1").classList.toggle("bat", g.half === 1);
  $("inn").textContent = g.phase === "over" ? "FINAL" : `${g.half ? "▼" : "▲"} ${g.inn}`;
  $("count").innerHTML = `B ${dots(g.balls, K.balls - 1)} S ${dots(g.strikes, K.strikes - 1)}<br>OUT ${dots(g.outs, K.outs - 1, "o")}`;
  const on = onBases(g), base = (x, y, lit) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${lit ? "#ffd23f" : "#ffffff22"}" stroke="#ffffffaa" stroke-width="1.2"/>`;
  $("dia").innerHTML = base(34, 16, on[0]) + base(22, 6, on[1]) + base(10, 16, on[2]);
  const ui = (id, show) => { $(id).hidden = !show; };
  if (ATTRACT) { for (const id of ["sb", "role", "matchup", "net", "clockBar", "pitchUI", "batUI", "runUI", "throwUI", "over"]) $(id).hidden = true; $("net").textContent = ""; return; }
  // what I do now
  const upIn = team === g.half ? (g.seats[g.half].indexOf(net.sessionId) - (g.order[g.half] % K.lineup) + K.lineup) % K.lineup : -1;
  const roles = {
    bat: ["YOU'RE UP!", touchUI ? "Drag to put the ring on the ball, SWING as it arrives. Ring above the ball: a grounder. Below: in the air." : "Mouse or arrows: put the ring on the ball. Click or Space as it arrives. Ring above the ball: a grounder. Below: in the air."],
    pitch: ["YOU'RE PITCHING", `Pick a pitch, aim at a spot, then ${touchUI ? "PITCH" : "click or Space"}. Corners and off-speed fool batters.`],
    run: P && P.hr ? ["IT'S GONE!", "Touch 'em all."] : ["IT'S IN PLAY!", "RUN! sends everyone for an extra base. Risky."],
    field: ["FIELDING", "Tap a base: the next throw goes there."],
  };
  const r = roles[role] || (g.phase === "over" ? ["BALLGAME", ""] : team < 0 ? ["WATCHING", "Both teams are full: you'll get a spot when one opens."] : team === g.half ? ["YOUR TEAM IS BATTING", g.bases.includes(net.sessionId) ? "You're on base" : upIn > 0 ? `You're up in ${upIn} batter${upIn > 1 ? "s" : ""}` : "You're up next"] : ["YOUR TEAM IS FIELDING", g.pit === net.sessionId ? "You're pitching" : "You pitch to a later batter"]);
  $("role").innerHTML = `${esc(r[0])}<small>${esc(r[1])}</small>`;
  ui("pitchUI", role === "pitch");
  for (const b of $("pitchUI").querySelectorAll("[data-ty]")) b.classList.toggle("on", b.dataset.ty === me.ty);
  ui("batUI", role === "bat" && touchUI);
  ui("runUI", role === "run" && P && !P.hr);
  $("bRun").classList.toggle("on", !!P && me.runN === P.n); $("bHold").classList.toggle("on", !P || me.runN !== P.n);
  ui("throwUI", role === "field" && P && !["none", "gone", "foul"].includes(P.st));
  for (const b of $("throwUI").querySelectorAll("button")) b.classList.toggle("on", !!me.pick && !!P && me.pick.n === P.n && +b.dataset.base === me.pick.base);
  ui("clockBar", role === "pitch");
  if (role === "pitch") $("clockBar").firstElementChild.style.width = `${clamp((g.at - T) / K.pitchClockMs, 0, 1) * 100}%`;
  const bt = teamOfId(g, g.bat), pt = teamOfId(g, g.pit);
  const thrown = g.phase === "pitch" && pitch() && T >= pitch().at ? ` · <b>${PITCHES[pitch().ty].name}</b>` : "";
  $("matchup").innerHTML = ["ready", "pitch"].includes(g.phase) ? `<span style="color:${bt >= 0 ? TEAMS[bt].color : "#fff"}">${esc(g.bat === net.sessionId ? "You" : nameOf(g.bat))}</span> at bat · <span style="color:${pt >= 0 ? TEAMS[pt].color : "#fff"}">${esc(g.pit === net.sessionId ? "You" : nameOf(g.pit))}</span> pitching${thrown}` : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the game" : ""}`;
  // the results card
  const card = g.phase === "over" && T > g.at - K.resultsMs + 1600;
  $("over").hidden = !card;
  if (!card) return;
  $("winner").textContent = g.win === 2 ? "A draw!" : team === g.win ? "You win!" : `${TEAMS[g.win].name} win!`;
  $("winner").style.color = g.win === 2 ? "#fff" : TEAMS[g.win].color;
  const inns = Math.max(K.innings, g.inn), hits = (t) => g.seats[t].reduce((a, id) => a + ((g.st[id] || [])[1] || 0), 0);
  $("line").innerHTML = `<tr><th></th>${Array.from({ length: inns }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th></tr>` + [0, 1].map((t) =>
    `<tr><td><i style="background:${TEAMS[t].color}"></i>${TEAMS[t].short}</td>${Array.from({ length: inns }, (_, i) => `<td>${g.ln[t][i] ?? (t === 1 && i === inns - 1 && g.win === 1 && g.half === 0 ? "X" : "")}</td>`).join("")}<td><b>${g.score[t]}</b></td><td>${hits(t)}</td></tr>`).join("");
  const rows = Object.entries(g.st || {}).map(([id, s]) => ({ id, s, t: teamOfId(g, id) })).sort((a, b) => b.s[2] - a.s[2] || b.s[0] - a.s[0] || b.s[1] - a.s[1]).slice(0, 8);
  $("stats").innerHTML = `<tr><th>Player</th><th>R</th><th>H</th><th>HR</th></tr>` + (rows.length ? rows.map(({ id, s, t }) =>
    `<tr class="${id === net.sessionId ? "me" : ""}"><td><i style="background:${t >= 0 ? TEAMS[t].color : "#777"}"></i>${esc(id === net.sessionId ? "You" : s[3] || nameOf(id))}</td><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td></tr>`).join("") : `<tr><td>Nobody got a hit.</td></tr>`);
  $("again").hidden = team < 0;
  $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
  $("next").textContent = `Next game in ${Math.max(0, Math.ceil((g.at - T) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(((g.st || {})[net.sessionId] || [0, 0, 0])[2]); }
}
function showBoard(myHomers) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (myHomers > 0 ? board.submit(myHomers).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} HR</span></li>`).join("") : "<li>No homers yet. Hit the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };
/** My swing's timing, shown for a moment under the zone. */
function drawTiming(now) {
  const el = $("timing"), r = me.rel && now - me.rel.at < 1100 ? me.rel : null;
  el.classList.toggle("on", !!r);
  if (!r) return;
  const a = Math.abs(r.dt), late = r.dt > 0;
  el.textContent = a <= CONFIG.perfectMs ? "PERFECT TIMING" : a <= CONFIG.foulMs ? (late ? "A BIT LATE" : "A BIT EARLY") : late ? "LATE" : "EARLY";
  el.style.color = a <= CONFIG.perfectMs ? "#7cf29a" : a <= CONFIG.foulMs ? "#ffd23f" : "#ff8a6a";
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. Bots wear team colors only. */
const takenColors = () => new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
function fixColor() {
  if (!Object.entries(S.entities.players || {}).some(([id, p]) => id < net.sessionId && p.c === myColor)) return;
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set();
const ptr = { x: 0, y: 0, has: false, mouse: false, moved: false }; // the mouse, for aiming the ring or the pitch
let drag = null; // a finger moving the ring or the aim: { id, x, y }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), platePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), ZONE.y), hitP = new THREE.Vector3();
/** The pointer turned into a spot on the plate, through the camera that drew the frame (zone half-widths). */
function zoneAtPointer() {
  ndc.set((ptr.x / innerWidth) * 2 - 1, -(ptr.y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(platePlane, hitP)) return null;
  return { x: clamp(hitP.x / ZONE.hw, -1.8, 1.8), y: clamp((hitP.y - ZONE.h0) / ZONE.hh, -1.8, 1.8) };
}
function act(e) { const role = myRole(game()); if (role === "bat") swing(e); else if (role === "pitch") throwMyPitch(); }
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys.add(k);
  if (k === " " || k === "enter") act(e);
  const role = myRole(game());
  if (role === "pitch" && ["1", "2", "3"].includes(k)) me.ty = ["fast", "curve", "change"][+k - 1];
  if (role === "field" && ["1", "2", "3", "4", "h"].includes(k)) pickBase(k === "h" ? 4 : +k);
  if (role === "run" && k === "r") sendRun();
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { Object.assign(ptr, { x: e.clientX, y: e.clientY, has: true, mouse: true, moved: true }); act(e); return; }
  if (!drag) { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { Object.assign(ptr, { x: e.clientX, y: e.clientY, has: true, mouse: true, moved: true }); return; }
  if (!drag || e.pointerId !== drag.id) return;
  const dx = (e.clientX - drag.x) / 70, dy = -(e.clientY - drag.y) / 70, role = myRole(game()); // 70px of finger = one zone half-width
  drag.x = e.clientX; drag.y = e.clientY;
  if (role === "bat") { me.cx = clamp(me.cx + dx, -1.8, 1.8); me.cy = clamp(me.cy + dy, -1.8, 1.8); }
  if (role === "pitch") { me.ax = clamp(me.ax + dx, -1.8, 1.8); me.ay = clamp(me.ay + dy, -1.8, 1.8); }
});
cv.addEventListener("contextmenu", (e) => e.preventDefault());
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (drag && e.pointerId === drag.id) drag = null; });
function tap(el, fn) { el.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); fn(e); }); }
tap($("bSwing"), swing);
tap($("bPitch"), throwMyPitch);
for (const b of $("pitchUI").querySelectorAll("[data-ty]")) tap(b, () => { me.ty = b.dataset.ty; });
tap($("bRun"), sendRun);
tap($("bHold"), () => {});
for (const b of $("throwUI").querySelectorAll("button")) tap(b, () => pickBase(+b.dataset.base));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastReal = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = performance.now(); // a freeze is measured on the real clock (the frame's own time can be stale after one)
  if (real - lastReal > 1000) { host.wasHost = false; host.last = null; host.lastPitch = null; host.quietUntil = real + 700; } // woke up: wait for fresh state, then adopt it
  lastReal = real;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncViews(dt);
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g);
    drawWorld(g, dt, now);
    paintScoreboard(g);
    drawTiming(now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
  tickParts(dt); tickFireworks(now); tickCrowd(dt, now);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("swing", (m, from) => { if (isHost()) applySwing(from, m); });
  net.on("pitch", (m, from) => { if (isHost()) applyPitch(from, m); });
  net.on("run", (m, from) => { if (isHost()) applyRun(from, m); });
  net.on("throw", (m, from) => { if (isHost()) applyThrowPick(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { introMs: 500, botPitchMs: 300, windupMs: 560, callMs: 450, playCallMs: 800, hrCallMs: 1700, switchMs: 900, resultsMs: 1500,
    innings: 99, mercyRuns: 4, botSwingZone: 1, botChase: 0.7, botHits: { whiff: 0.1, foul: 0.06, ground: 0.16, liner: 0.3, fly: 0.16, hr: 0.22 } });
  if (ATTRACT || TEST) window.__sp = () => { const g = game(), P = playNow(); return { g, p: pitch(), host: isHost(), play: P && { n: P.n, st: P.st, k: P.k, rn: P.rn, outs: P.outs, runs: P.runs }, fl: host.fl.map((f) => [r1(f.x), r1(f.y)]), off: clock.off, cfg: CONFIG, raw: host.play, role: myRole(g), me: net.sessionId,
    aim: (x, y) => { me.cx = x; me.cy = y; }, pitchAt: (ty, x, y) => { me.ty = ty; me.ax = x; me.ay = y; throwMyPitch(); }, run: sendRun, pick: pickBase }; }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
